<!DOCTYPE html>
<html x-data="{ lang: 'fa' }" :lang="lang" :dir="lang === 'fa' ? 'rtl' : 'ltr'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIVRAS - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'IRANSans', 'Vazirmatn', sans-serif;
            background-color: #f8fafc;
        }
        .glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen relative overflow-x-hidden">
    <!-- Background Decorators (Teal & Blue Theme) -->
    <div class="fixed top-0 left-0 w-[600px] h-[600px] bg-teal-200 rounded-full mix-blend-multiply filter blur-[120px] opacity-40 -translate-x-1/2 -translate-y-1/2 pointer-events-none z-0"></div>
    <div class="fixed bottom-0 right-0 w-[600px] h-[600px] bg-blue-200 rounded-full mix-blend-multiply filter blur-[120px] opacity-40 translate-x-1/2 translate-y-1/2 pointer-events-none z-0"></div>
    
    <!-- Header -->
    <header class="glass shadow-sm w-full sticky top-0 z-50 border-b border-white">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-teal-600 to-blue-600 tracking-tight">SIVRAS</h1>
                <div class="hidden md:block w-px h-6 bg-slate-300 mx-2"></div>
                <span class="hidden md:inline-block text-sm font-bold text-slate-500">
                    <span x-show="lang === 'fa'">پلتفرم جامع مدیریت نمایندگان علمی</span>
                    <span x-show="lang === 'en'" x-cloak>Comprehensive Med-Rep Platform</span>
                </span>
            </div>
            <nav class="flex gap-4 items-center">
                <button @click="lang = lang === 'fa' ? 'en' : 'fa'" class="flex items-center gap-2 text-xs font-bold text-teal-700 bg-teal-50 hover:bg-teal-100 transition-colors px-4 py-2 rounded-xl border border-teal-200 shadow-sm">
                    <i class="fa-solid fa-language text-lg"></i>
                    <span x-text="lang === 'fa' ? 'English' : 'فارسی'"></span>
                </button>
                
        <a href="index.html" class="text-sm font-bold text-slate-600 hover:text-teal-600 bg-white/50 px-4 py-2 rounded-xl border border-slate-200">
            <i class="fa-solid fa-home mr-1 ml-1"></i>
            <span x-show="lang === 'fa'">خانه</span>
            <span x-show="lang === 'en'" x-cloak>Home</span>
        </a>
        
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-10 relative z-10 flex-grow" >
        
        <div class="flex items-center justify-center min-h-[75vh]">
            <div class="glass p-10 md:p-12 rounded-[3rem] shadow-2xl w-full max-w-md border border-white bg-white/60">
                <div class="text-center mb-10">
                    <div class="w-20 h-20 bg-gradient-to-br from-teal-400 to-blue-500 rounded-2xl mx-auto mb-6 flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-fingerprint text-white text-3xl"></i>
                    </div>
                    <h2 class="text-3xl font-black text-slate-800 mb-2">
                        <span x-show="lang === 'fa'">ورود به سیستم</span>
                        <span x-show="lang === 'en'" x-cloak>Sign In</span>
                    </h2>
                    <p class="text-slate-500 font-medium">
                        <span x-show="lang === 'fa'">پلتفرم هوشمند مدیریت ویزیت</span>
                        <span x-show="lang === 'en'" x-cloak>Smart Visit Management Platform</span>
                    </p>
                </div>
                <form class="space-y-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">
                            <span x-show="lang === 'fa'">نقش کاربری</span>
                            <span x-show="lang === 'en'" x-cloak>User Role</span>
                        </label>
                        <select onchange="window.location.href = this.value" class="w-full border-2 border-slate-200 rounded-2xl px-5 py-4 bg-white/80 focus:ring-4 focus:ring-teal-500/20 focus:border-teal-500 outline-none transition-all font-bold text-slate-700 appearance-none cursor-pointer">
                            <option value="">انتخاب کنید / Select...</option>
                            <option value="superadmin_dashboard.html">سوپر ادمین / Super Admin</option>
                            <option value="provincial_admin_dashboard.html">ادمین استانی / Provincial Admin</option>
                            <option value="hq_operator_dashboard.html">اپراتور ستاد / HQ Operator</option>
                            <option value="medrep_dashboard.html">نماینده علمی / Med-Rep</option>
                            <option value="organization_rep_dashboard.html">نماینده سازمان / Org-Rep</option>
                            <option value="doctor_dashboard.html">پزشک / Doctor</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">
                            <span x-show="lang === 'fa'">شماره موبایل / ایمیل</span>
                            <span x-show="lang === 'en'" x-cloak>Mobile Number / Email</span>
                        </label>
                        <input type="text" class="w-full border-2 border-slate-200 rounded-2xl px-5 py-4 bg-white/80 focus:ring-4 focus:ring-teal-500/20 focus:border-teal-500 outline-none transition-all font-medium text-left dir-ltr" placeholder="09123456789">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">
                            <span x-show="lang === 'fa'">رمز عبور</span>
                            <span x-show="lang === 'en'" x-cloak>Password</span>
                        </label>
                        <input type="password" class="w-full border-2 border-slate-200 rounded-2xl px-5 py-4 bg-white/80 focus:ring-4 focus:ring-teal-500/20 focus:border-teal-500 outline-none transition-all font-medium text-left dir-ltr" placeholder="••••••••">
                    </div>
                    <div class="flex items-center justify-between text-sm">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="checkbox" class="rounded w-4 h-4 text-teal-600 focus:ring-teal-500 border-slate-300">
                            <span class="text-slate-600 font-bold group-hover:text-slate-900 transition-colors">
                                <span x-show="lang === 'fa'">مرا به خاطر بسپار</span>
                                <span x-show="lang === 'en'" x-cloak>Remember Me</span>
                            </span>
                        </label>
                        <a href="#" class="text-teal-600 font-bold hover:text-teal-700 hover:underline">
                            <span x-show="lang === 'fa'">فراموشی رمز؟</span>
                            <span x-show="lang === 'en'" x-cloak>Forgot Password?</span>
                        </a>
                    </div>
                    <button type="button" class="w-full bg-slate-800 text-white rounded-2xl py-4 font-bold text-lg shadow-xl hover:bg-slate-700 hover:-translate-y-0.5 transition-all active:scale-95">
                        <span x-show="lang === 'fa'">ورود به داشبورد</span>
                        <span x-show="lang === 'en'" x-cloak>Login to Dashboard</span>
                    </button>
                </form>
            </div>
        </div>
        
    </main>

    <!-- Footer -->
    <footer class="mt-auto py-8 border-t border-white text-center text-slate-500 relative z-10 glass">
        <div class="container mx-auto font-medium">
            <p>
                <span x-show="lang === 'fa'">&copy; 2026 پلتفرم SIVRAS. تمامی حقوق محفوظ است.</span>
                <span x-show="lang === 'en'" x-cloak>&copy; 2026 SIVRAS Platform. All rights reserved.</span>
            </p>
        </div>
    </footer>
</body>
</html>
